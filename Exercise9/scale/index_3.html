<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scale Box Demo with Slider</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 1.25rem;
      }
      #box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #3b82f6;
        color: white;
        transition: width .15s ease, height .15s ease;
        user-select: none;
      }
      .controls {
        display: flex;
        gap: .5rem;
        margin: .75rem 0;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label for="slider">Size</label>
      <input id="slider" type="range" min="30" max="500" step="20" value="100">
      <!-- Range input (slider):
            type="range": creates a slider control
            min="60": minimum selectable value
            max="320": maximum selectable value
            step="20": increment between values (60, 80, 100, ...)
            value="100": initial value when the page loads
        -->
      <button id="reset">Reset</button>
    </div>
    <div id="box"></div>

    <script>
      const box = document.querySelector('#box');
      const slider = document.querySelector('#slider');
      const reset = document.querySelector('#reset');

      let sizePx = 100;
      let blue = 200;

      function render() {
        box.style.width = sizePx + 'px';
        box.style.height = sizePx + 'px';
        box.style.backgroundColor = `rgb(50, 100, ${blue})`;
        box.innerHTML = 'Size: ' + sizePx + 'px <br>' + 'Blue: ' + blue;
      }

      slider.addEventListener('input', () => {
        // slider.value returns a string.
        // Number() converts it to a number for calculations.
        // The slider's min and max already constrain the size.
        sizePx = Number(slider.value);
        blue = Math.max(0, Math.min(255, 200 + (sizePx - 100)));
        render();
      });

      reset.addEventListener('click', () => {
        slider.value = 100;
        sizePx = 100;
        blue = 200;
        render();
      });

      render(); 
    </script>
  </body>
</html>

<!--STYLE YOUR BLOCK SHIT HERE!-->
<style>
/* SAMPLE 1 */
    .block1{
    background:dodgerblue; height:5vw; width:30vw; position: relative;
    animation-duration: 2s;
    margin-left: 0vw;
    padding-left: 0vw;
    }

    .block2{
        background:dodgerblue; height:stretch; width:5vw;
    }
    .block3{
        background:dodgerblue; height:5vw; width:50%;
    }

    .blockRange{ /*space-between flexer*/
        display:flex; justify-content: space-between; align-items: flex-end;  height:20vw;
    }

    .blockRange2{ /*space-between flexer*/
        display:flex; justify-content: space-between; align-items: flex-end;  height:fit-content;
    }

    .block1, .block2, .block3{
        border-radius: 0px; 
        transition:border-radius 0.5s ease, width 0.5s ease, transform 0.5s ease, margin-left 0.5s ease, margin-right 0.5s ease, padding-left 0.5s ease, padding-right 0.5s ease;
    }    
    .block1:hover, .block2:hover, .block3:hover{
        border-radius: 100px;  width:50%;
        transition-delay: 0s; 
        margin-left: 10vw;
        padding-left: 10vw;
    }
    .block1:hover{
        width:5vw;
    }
/* SAMPLE 2 */
    .bubblepiece1{
        position:absolute; top: 5vw; right:5vw; background:radial-gradient(dodgerblue, royalblue); height:5vw; width:5vw; border-radius:50vw; z-index: 3;
    }

    .bubblepiece2{
        position:absolute; top: 10vw; right:5vw; background:radial-gradient(dodgerblue, royalblue);  height:15vw; width:5vw; border-radius:50vw; z-index: 2;
    }

    .bubblepiece3{
        position:absolute; top: 22vw; right:5vw; background:linear-gradient(dodgerblue, royalblue); height:8vw; width:12vw; border-bottom-right-radius:50vw; border-bottom-left-radius:50vw; border-top-left-radius:5vw; z-index: 1;
    }

    .bubblepiece1, .bubblepiece2, .bubblepiece3{
        scale:1;
        margin:0vw;
        transform-origin: left;
        transform: translateY(0vw);
        transition: scale 0.5s ease, margin 0.5s ease, transform 0.3s ease;
    }
    .bubblepiece1:hover, .bubblepiece2:hover, .bubblepiece3:hover{
        scale:1.5;
        margin:5vw;
        transform: translateY(-2.5vw);
    }

/* SAMPLE 3 */
    .blockRangeGrid{
        display:grid;
        grid-template-columns: repeat(6, 1fr); 
        grid-auto-rows: auto; 
          gap: 0px;     
    }
    .gridPixel{
        background:dodgerblue; height:6vw; width:stretch;
    }
    .gridPixel2{
        background:royalblue; height:6vw; width:stretch;
    }
    .gridPixel, .gridPixel2{
        border-radius:0vw;
        scale:1;
        transition: border-radius 0.3s ease, scale 0.3s ease;
    }
    .gridPixel:hover, .gridPixel2:hover{
        border-radius:10vw;
        scale:1.5;
        background:royalblue;
        z-index: 50;
    }
/* LAST SAMPLE */
    .lastLetter{
        border-top: 10px solid dodgerblue ; 
        border-right: 30px solid dodgerblue; 
        width: 80%; height:40%; margin:0vw 20px;
    }
    .lastLetterNum2{
        border-bottom: 30px solid dodgerblue ; 
        border-right: 30px solid dodgerblue;  
        border-left: 10px solid dodgerblue;  
        width: 80%; height:40%; margin:0vw 10px;
        border-bottom-right-radius: 50vw;
        border-bottom-left-radius: 50vw;
    }
</style>
